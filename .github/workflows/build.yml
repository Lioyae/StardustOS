name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS="-Werror"

      - name: Build
        run: cmake --build build

      - name: Test (unit + assert build + worst-case build + multi-seed interleave)
        run: |
          ctest --test-dir build --output-on-failure
          for i in $(seq 1 20); do
            STAR_TEST_SEED=$i ./build/test_stardustos || exit 1
          done
          for i in $(seq 1 10); do
            STAR_TEST_SEED=$i ./build/test_stardustos_max || exit 1
          done

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-san -DCMAKE_C_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-san

      - name: Test
        run: |
          ctest --test-dir build-san --output-on-failure
          for i in $(seq 1 5); do
            STAR_TEST_SEED=$i ./build-san/test_stardustos || exit 1
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-cov -DCMAKE_C_FLAGS="-Werror --coverage -O0"

      - name: Build
        run: cmake --build build-cov

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      - name: Coverage report (fail under 85% lines)
        run: |
          pip install gcovr
          gcovr --root . --exclude tests --exclude 'build.*' \
            --merge-mode-functions=separate \
            --fail-under-line 85 --print-summary

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # 只做 host 配置的静态分析：8051/251 port 头含 sfr/sbit 等 Keil 扩展，
      # cppcheck 无法解析，故通过 -Istardustos/port/host 让内核按 host 配置展开
      - name: Static analysis (kernel + host port + tests)
        run: |
          cppcheck --enable=warning,performance,portability --std=c99 \
            --inline-suppr --error-exitcode=1 \
            -Istardustos -Istardustos/port/host -Itests \
            stardustos/star.c stardustos/star_task.c stardustos/star_mail.c \
            stardustos/port/star_port.c tests
