name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS="-Werror"

      - name: Build
        run: cmake --build build

      - name: Test (unit + assert build + worst-case build + multi-seed interleave)
        run: |
          ctest --test-dir build --output-on-failure
          for i in $(seq 1 20); do
            STAR_TEST_SEED=$i ./build/test_stardustos || exit 1
          done
          for i in $(seq 1 10); do
            STAR_TEST_SEED=$i ./build/test_stardustos_max || exit 1
          done

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-san -DCMAKE_C_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-san

      - name: Test
        run: |
          ctest --test-dir build-san --output-on-failure
          for i in $(seq 1 5); do
            STAR_TEST_SEED=$i ./build-san/test_stardustos || exit 1
          done

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz
          tar xf xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -C /opt
          echo "/opt/xpack-riscv-none-elf-gcc-15.2.0-1/bin" >> "$GITHUB_PATH"

      - name: Compile Cortex-M0+ (thumb, -Os, size check)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m0plus -mthumb \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/cm0plus -Itests/stubs
          arm-none-eabi-size -t star.o star_task.o star_mail.o star_port.o
          # 内核三件套与移植层分账断言：移植层（SysTick/临界区/idle）单独设限
          TEXT_K=$(arm-none-eabi-size -t star.o star_task.o star_mail.o | tail -1 | awk '{print $1}')
          TEXT_P=$(arm-none-eabi-size star_port.o | tail -1 | awk '{print $1}')
          RAM=$(arm-none-eabi-size -t star.o star_task.o star_mail.o star_port.o | tail -1 | awk '{print $2+$3}')
          echo "m0plus kernel: text=${TEXT_K}B port=${TEXT_P}B ram=${RAM}B"
          test "$TEXT_K" -lt 2560 || { echo "kernel text too large"; exit 1; }
          test "$TEXT_P" -lt 512 || { echo "port text too large"; exit 1; }
          test "$RAM" -lt 512 || { echo "kernel ram too large"; exit 1; }
          rm -f *.o

      - name: Compile Cortex-M3 (thumb)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -mcpu=cortex-m3 -mthumb \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/cm3 -Itests/stubs
          rm -f *.o

      - name: Compile Cortex-M0+ worst-case config (queue 255, delayed 16)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m0plus -mthumb \
            -DSTAR_EVT_QUEUE_SIZE=255 -DSTAR_DELAYED_MAX=16 \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/cm0plus -Itests/stubs
          arm-none-eabi-size -t star.o star_task.o star_mail.o
          rm -f *.o

      - name: Compile Cortex-M0+ tickless (STAR_TICKLESS=1)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m0plus -mthumb \
            -DSTAR_TICKLESS=1 -DSTAR_PORT_HCLK_HZ=24000000u \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/cm0plus -Itests/stubs
          arm-none-eabi-size -t star.o star_task.o star_mail.o star_port.o
          rm -f *.o

      - name: Compile Cortex-M3 tickless (STAR_TICKLESS=1)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -mcpu=cortex-m3 -mthumb \
            -DSTAR_TICKLESS=1 -DSTAR_PORT_HCLK_HZ=72000000u \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/cm3 -Itests/stubs
          rm -f *.o

      - name: Compile RISC-V RV32 (WCH QingKe, -Os, size check)
        run: |
          riscv-none-elf-gcc -std=c99 -Wall -Wextra -Werror -Os -march=rv32imc_zicsr -mabi=ilp32 \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/ch32v -Itests/stubs
          riscv-none-elf-size -t star.o star_task.o star_mail.o star_port.o
          # 内核三件套与移植层分账断言（移植层含 SysTick/临界区/idle）
          TEXT_K=$(riscv-none-elf-size -t star.o star_task.o star_mail.o | tail -1 | awk '{print $1}')
          TEXT_P=$(riscv-none-elf-size star_port.o | tail -1 | awk '{print $1}')
          RAM=$(riscv-none-elf-size -t star.o star_task.o star_mail.o star_port.o | tail -1 | awk '{print $2+$3}')
          echo "rv32 kernel: text=${TEXT_K}B port=${TEXT_P}B ram=${RAM}B"
          test "$TEXT_K" -lt 2816 || { echo "kernel text too large"; exit 1; }
          test "$TEXT_P" -lt 512 || { echo "port text too large"; exit 1; }
          test "$RAM" -lt 512 || { echo "kernel ram too large"; exit 1; }
          rm -f *.o

      - name: Compile RISC-V RV32 worst-case config (queue 255, delayed 16)
        run: |
          riscv-none-elf-gcc -std=c99 -Wall -Wextra -Werror -Os -march=rv32imc_zicsr -mabi=ilp32 \
            -DSTAR_EVT_QUEUE_SIZE=255 -DSTAR_DELAYED_MAX=16 \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/ch32v -Itests/stubs
          riscv-none-elf-size -t star.o star_task.o star_mail.o
          rm -f *.o

      - name: Compile RISC-V RV32 tickless (STAR_TICKLESS=1)
        run: |
          riscv-none-elf-gcc -std=c99 -Wall -Wextra -Werror -Os -march=rv32imc_zicsr -mabi=ilp32 \
            -DSTAR_TICKLESS=1 -DSTAR_PORT_HCLK_HZ=48000000u \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/ch32v -Itests/stubs
          riscv-none-elf-size -t star.o star_task.o star_mail.o star_port.o
          rm -f *.o

      - name: Compile STM32F103 example against real CMSIS/ST headers
        run: |
          git init /tmp/cmsis5
          git -C /tmp/cmsis5 remote add origin https://github.com/ARM-software/CMSIS_5
          git -C /tmp/cmsis5 fetch --depth 1 origin 55b19837f5703e418ca37894d5745b1dc05e4c91
          git -C /tmp/cmsis5 checkout --detach FETCH_HEAD
          git init /tmp/cmsis-f1
          git -C /tmp/cmsis-f1 remote add origin https://github.com/STMicroelectronics/cmsis-device-f1
          git -C /tmp/cmsis-f1 fetch --depth 1 origin c8e9a4a4f16b6d2cb2a2083cbe5161025280fb22
          git -C /tmp/cmsis-f1 checkout --detach FETCH_HEAD
          # 例程启用了 tickless：这两个宏必须工程级全局生效（例程 main.c 内的
          # define 只作用于该文件，star_port.c 靠命令行 -D 拿到同值）
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -mcpu=cortex-m3 -mthumb \
            -DSTAR_TICKLESS=1 -DSTAR_PORT_HCLK_HZ=72000000u \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            examples/stm32f103/main.c \
            -Istardustos -Istardustos/port/cm3 \
            -I/tmp/cmsis5/CMSIS/Core/Include \
            -I/tmp/cmsis-f1/Include

      - name: Compile CH32V003 example against real WCH SDK
        run: |
          # 钉住 SDK 提交，避免上游变更导致 CI 意外变红；单次 fetch 省一半网络
          git init /tmp/ch32v003
          git -C /tmp/ch32v003 remote add origin https://github.com/openwch/ch32v003
          git -C /tmp/ch32v003 fetch --depth 1 origin 2ac68039c911e0313e2625811b631a8e9e55b9c0
          git -C /tmp/ch32v003 checkout --detach FETCH_HEAD
          SDK=/tmp/ch32v003/EVT/EXAM/SRC
          USER=/tmp/ch32v003/EVT/EXAM/ADC/ADC_DMA/User
          # 例程启用了 tickless：宏须工程级全局生效（-D 与 main.c 内定义同值）
          riscv-none-elf-gcc -std=c99 -Wall -Wextra -Werror -march=rv32imc_zicsr_zifencei -mabi=ilp32 \
            -DSTAR_TICKLESS=1 -DSTAR_PORT_HCLK_HZ=48000000u \
            -c stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            examples/ch32v003/main.c \
            -Istardustos -Istardustos/port/ch32v \
            -I"$SDK/Core" -I"$SDK/Peripheral/inc" -I"$SDK/Debug" -I"$USER"

  qemu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm

      - name: Build smoke test (Cortex-M3, stm32vldiscovery)
        run: |
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m3 -mthumb \
            -ffreestanding -nostdlib -T tests/qemu/cm3/link.ld \
            -o /tmp/stardustos_qemu.elf \
            tests/qemu/cm3/main.c tests/qemu/cm3/startup.c \
            stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/cm3

      - name: Run in QEMU (boot, vectors, SysTick, timer→event flow)
        run: |
          # 判定靠 stdout 的 QEMU_PASS/QEMU_FAIL 关键字（semihosting 退出码
          # 在各平台透传不一致）；向量表/SysTick 断掉时死循环 → timeout 判失败
          timeout 60s qemu-system-arm -M stm32vldiscovery -cpu cortex-m3 \
            -nographic -monitor none \
            -semihosting-config enable=on,target=native \
            -kernel /tmp/stardustos_qemu.elf 2>&1 | tee /tmp/qemu.log
          grep -q "QEMU_PASS" /tmp/qemu.log || { echo "smoke test failed"; exit 1; }
          ! grep -q "QEMU_FAIL" /tmp/qemu.log || { echo "smoke test reported failure"; exit 1; }

      - name: Build smoke test (Cortex-M3, tickless accounting + long-nap flow)
        run: |
          # HCLK 用 24kHz 时间膨胀：QEMU 的 WFI 模型在重装 SysTick 后产生
          # 伪唤醒、深睡退化为轮询，真实 24MHz 换算下 3000 拍无法在 CI 时限
          # 内完成；膨胀后 1 tick-ms=24 计数器周期，入账数学与换算率无关
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Werror -Os -mcpu=cortex-m3 -mthumb \
            -ffreestanding -nostdlib -T tests/qemu/cm3/link.ld \
            -DSTAR_TICKLESS=1 -DSTAR_PORT_HCLK_HZ=24000u \
            -o /tmp/stardustos_qemu_tickless.elf \
            tests/qemu/cm3/main_tickless.c tests/qemu/cm3/startup.c \
            stardustos/star.c stardustos/star_task.c stardustos/star_mail.c stardustos/port/star_port.c \
            -Istardustos -Istardustos/port/cm3

      - name: Run tickless in QEMU (accounting, segmented naps, drift check)
        run: |
          # tickless 空闲路径（入账/rem==0 窗口/nap 钳制/固定拍恢复）仅在
          # 此冒烟被编译与执行；1000ms 周期定时器 3 拍后 ticks 须落在
          # [3000, 4000]：下界抓入账跑快（双重入账），上界为 QEMU SysTick
          # ptimer 重载滞后（TCG 批内事件不处理）留的仿真余量
          timeout 60s qemu-system-arm -M stm32vldiscovery -cpu cortex-m3 \
            -nographic -monitor none \
            -semihosting-config enable=on,target=native \
            -kernel /tmp/stardustos_qemu_tickless.elf 2>&1 | tee /tmp/qemu_tickless.log
          grep -q "QEMU_PASS" /tmp/qemu_tickless.log || { echo "tickless smoke failed"; exit 1; }
          ! grep -q "QEMU_FAIL" /tmp/qemu_tickless.log || { echo "tickless smoke reported failure"; exit 1; }

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-cov -DCMAKE_C_FLAGS="-Werror --coverage -O0"

      - name: Build
        run: cmake --build build-cov

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      - name: Coverage report (fail under 85% lines)
        run: |
          pip install gcovr
          gcovr --root . --exclude tests --exclude 'build.*' \
            --merge-mode-functions=separate \
            --fail-under-line 85 --print-summary

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Static analysis (warning/performance/portability)
        run: |
          cppcheck --enable=warning,performance,portability --std=c99 \
            --inline-suppr --error-exitcode=1 \
            -Istardustos -Istardustos/port/host -Itests stardustos
